<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildungskategorien – Beispieldaten</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 65vh;
            width: 100%;
        }
        .legend {
            background: white;
            padding: 10px;
            font-size: 12px;
            border: 1px solid black;
            line-height: 1.5;
        }
        .legend i {
            width: 18px;
            height: 18px;
            display: inline-block;
            margin-right: 8px;
        }
    </style>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="demo-header"><a href="../index.html">← Projektübersicht</a><p>Bildungskategorien · Fiktive Gebiete und Häufigkeiten. Schulische und berufliche Kategorien können sich überschneiden; dies ist kein amtlicher Vergleich.</p></header>
<main class="demo-content">
    <h1>Größte erfasste Bildungskategorie je Beispielgebiet</h1>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialisieren der Karte
        const map = L.map('map').setView([48.7758, 9.1829], 12);

        // Hinzufügen eines Kartenhintergrunds
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Farben für alle in der Übung ausgewerteten Kategorien.
        const colors = {"Fachschulabschluss":"#8c6bb1","Hochschulabschluss":"#2b8cbe","Kein beruflicher Abschluss":"#9e9e9e","Berufsausbildung":"#ff9800","Promotionsabschluss":"#54278f","Hauptschulabschluss":"#a6761d","Hochschulreife":"#4caf50","Kein Schulabschluss":"#d95f59","Realschulabschluss":"#4e79a7"};
        function getColor(education) { return colors[education] || '#ddd'; }

        // Funktion zur Berechnung des häufigsten Bildungsabschlusses
        function getMostCommonEducation(properties) {
            const educationCounts = {
                "Fachschulabschluss": properties.ot_beruf_f,
                "Hochschulabschluss": properties.ot_beruf_h,
                "Kein beruflicher Abschluss": properties.ot_beruf_k,
                "Berufsausbildung": properties.ot_beruf_l,
                "Promotionsabschluss": properties.ot_beruf_p,
                "Hauptschulabschluss": properties.ot_schul_h,
                "Hochschulreife": properties.ot_schul_1,
                "Kein Schulabschluss": properties.ot_schul_k,
                "Realschulabschluss": properties.ot_schul_m
            };

            // Bestimmen des Abschlusses mit der höchsten Anzahl
            let maxKey = null;
            let maxValue = -Infinity;
            for (const [key, value] of Object.entries(educationCounts)) {
                if (value > maxValue) {
                    maxKey = key;
                    maxValue = value;
                }
            }
            return maxKey;
        }

        // GeoJSON-Daten laden und verarbeiten
        fetch('Bildung.geojson')
            .then(response => response.json())
            .then(geojsonData => {
                // GeoJSON-Features zur Karte hinzufügen
                L.geoJson(geojsonData, {
                    style: function(feature) {
                        const education = getMostCommonEducation(feature.properties);
                        return {
                            fillColor: getColor(education),
                            weight: 1,
                            color: 'black',
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        const education = getMostCommonEducation(feature.properties);
                        const props = feature.properties;
                        layer.bindPopup(`
                            <strong>${props.ortsteil}</strong><br>
                            Größte Kategorie: ${education}<br><br>
                            <strong>Daten:</strong><br>
                            - Fachschulabschluss: ${props.ot_beruf_f}<br>
                            - Hochschulabschluss: ${props.ot_beruf_h}<br>
                            - Kein beruflicher Abschluss: ${props.ot_beruf_k}<br>
                            - Berufsausbildung: ${props.ot_beruf_l}<br>
                            - Promotionsabschluss: ${props.ot_beruf_p}<br>
                            - Hauptschulabschluss: ${props.ot_schul_h}<br>
                            - Hochschulreife: ${props.ot_schul_1}<br>
                            - Kein Schulabschluss: ${props.ot_schul_k}<br>
                            - Realschulabschluss: ${props.ot_schul_m}
                        `);
                    }
                }).addTo(map);
            })
            .catch(error => {
                console.error('Fehler beim Laden der GeoJSON-Datei:', error);
            });

        // Legende hinzufügen
        const legend = L.control({ position: "bottomright" });

        legend.onAdd = function(map) {
            const div = L.DomUtil.create("div", "legend");
            div.innerHTML += "<h4>Bildungsabschlüsse</h4>";
            div.innerHTML += '<i style="background: #4caf50"></i> Hochschulreife<br>';
            div.innerHTML += '<i style="background: #ff9800"></i> Berufsausbildung<br>';
            return div;
        };

        legend.addTo(map);
    </script>
</main>
</body>
</html>
