<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wärmebedarf und Baujahr Korrelation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.2/dist/apexcharts.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="demo-header"><a href="../index.html">← Projektübersicht</a><p>Wärmebedarfsanalyse · Fiktive Beispieldaten; kein Rückschluss auf reale Gebäude. Einheiten in der Demo: kWh bzw. kWh/m² pro Jahr.</p></header>
<main class="demo-content">
  <h1>Wärmebedarf im Vergleich zum Baujahr</h1>
  <div id="chart" style="max-width: 800px; margin: auto;"></div>
  <script>
      // Daten laden und Diagramm erstellen
      fetch('data.json')
      .then(response => response.json())
      .then(data => {
        // Extrahiere die Punkte für Baujahr und Wärmebedarf
        const points = data.features.filter(f => f.properties.Heated_are > 0).map(feature => {
          const baujahr = feature.properties.Year_of_co;
          const waermebedarf = feature.properties.Total_Year / feature.properties.Heated_are;
          return [baujahr, waermebedarf];
        });

        // Optionen für das Scatter-Diagramm
        var options = {
          series: [{
            name: "Wärmebedarf",
            data: points
          }],
          chart: {
            height: 350,
            type: 'scatter',
            zoom: {
              enabled: true,
              type: 'xy'
            }
          },
          xaxis: {
            title: {
              text: 'Baujahr'
            },
            tickAmount: 10,
            labels: {
              formatter: function(val) {
                return parseInt(val);
              }
            }
          },
          yaxis: {
            title: {
              text: 'Wärmebedarf (kWh/m²)'
            },
            tickAmount: 7
          },
          tooltip: {
            x: {
              title: {
                formatter: () => "Baujahr"
              }
            },
            y: {
              title: {
                formatter: () => "Wärmebedarf"
              }
            }
          }
        };
        
        // Erstelle das Diagramm und rendere es
        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();
      })
      .catch(error => { document.querySelector("#chart").textContent = "Daten konnten nicht geladen werden."; console.error(error); });
  </script>
</main>
</body>
</html>
