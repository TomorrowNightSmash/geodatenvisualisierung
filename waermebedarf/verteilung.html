<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wärmebedarf Visualisierung</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.49.2/dist/apexcharts.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="demo-header"><a href="../index.html">← Projektübersicht</a><p>Wärmebedarfsanalyse · Fiktive Beispieldaten; kein Rückschluss auf reale Gebäude. Einheiten in der Demo: kWh bzw. kWh/m² pro Jahr.</p></header>
<main class="demo-content">
  <h1>Wärmebedarfsverteilung nach Projektklassen</h1>
  <div id="chart" style="max-width: 800px; margin: auto;"></div>
  <script>
      fetch('data.json')
      .then(response => response.json())
      .then(data => {
    
        const klasse = ['A+', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
        let fueller = new Array(klasse.length).fill(0);

        data.features.forEach(feature => {
          if (!(feature.properties.Heated_are > 0)) return;
          const nutz = feature.properties.Total_Year / feature.properties.Heated_are;
          
          if (nutz <= 25) {
            fueller[0]++;
          } else if (nutz <= 50) {
            fueller[1]++;
          } else if (nutz <= 75) {
            fueller[2]++;
          } else if (nutz <= 100) {
            fueller[3]++;
          } else if (nutz <= 125) {
            fueller[4]++;
          } else if (nutz <= 150) {
            fueller[5]++;
          } else if (nutz <= 200) {
            fueller[6]++;
          } else if (nutz <= 250) {
            fueller[7]++;
          } else {
            fueller[8]++;
          }
        });

        var options = {
          series: fueller,
          chart: {
            type: 'donut'
          },
          labels: klasse,
          responsive: [{
            breakpoint: 480,
            options: {
              chart: {
                width: 200
              },
              legend: {
                position: 'bottom'
              }
            }
          }]
        };

        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();
      });
  </script>
</main>
</body>
</html>
