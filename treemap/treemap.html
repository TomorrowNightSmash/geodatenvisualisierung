<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TreeMap mit Beschriftungen und Farbtrennung</title>
<style>
  .rectangle {
    position: absolute;
    box-sizing: border-box;
    border: 1px solid black;
    color: black;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
  }
</style>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header class="demo-header"><a href="../index.html">← Projektübersicht</a><p>Treemap · Beispiel für eine flächenproportionale Darstellung von Dateigrößen.</p></header>
<main class="demo-content">

<div id="container" style="width:600px; height:400px; position:relative;"></div>

<script>
// JavaScript für die TreeMap-Erstellung
const container = document.getElementById('container');

function createRectangle(x, y, width, height, color, label) {
  const rect = document.createElement('div');
  rect.classList.add('rectangle');
  rect.style.left = `${x}px`;
  rect.style.top = `${y}px`;
  rect.style.width = `${width}px`;
  rect.style.height = `${height}px`;
  rect.style.backgroundColor = color;
  rect.innerText = label;  // Label für Name und Größe der Datei
  container.appendChild(rect);
}

// Ordner und Dateien mit klareren Farben
const ordner1 = [
  { name: 'DOC', size: 90, color: '#4f81bd' },  // Dunkelblau
  { name: 'PNG', size: 60, color: '#6fa8dc' },  // Mittelblau
  { name: 'PDF', size: 30, color: '#a4c2f4' }   // Hellblau
];
const ordner2 = [
  { name: 'DAT 1', size: 40, color: '#93c47d' },  // Dunkelgrün
  { name: 'DAT 2', size: 20, color: '#b6d7a8' }   // Hellgrün
];

// Berechnung und Platzierung der Rechtecke
function layoutTreeMap(data, x, y, width, height, totalSize) {
  let offsetY = y;
  for (const item of data) {
    const rectHeight = (item.size / totalSize) * height;
    // Label-Text mit Name und Größe
    const label = `${item.name} (${item.size} KB)`;
    createRectangle(x, offsetY, width, rectHeight, item.color, label);
    offsetY += rectHeight;
  }
}

// Anwendung auf die Ordner (600 x 400 Pixel, proportional zur Dateigröße)
layoutTreeMap(ordner1, 0, 0, 450, 400, 180);  // Ordner 1: 75 % der Fläche
layoutTreeMap(ordner2, 450, 0, 150, 400, 60); // Ordner 2: 25 % der Fläche

</script>

</main>
</body>
</html>
